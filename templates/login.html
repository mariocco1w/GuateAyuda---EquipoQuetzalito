<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | GuateAyuda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='private.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-logo">
            <span style="font-size:30px; font-weight:700; color:var(--blue-deep);">Guate<span class="logo-ayuda">Ayuda</span></span>
        </div>
        <div class="auth-subtitle">Bienvenido de nuevo · accede a tu panel</div>
        <form method="POST">
            <input type="text" name="usuario" class="auth-field" placeholder="Usuario">
            <input type="password" name="password" class="auth-field" placeholder="Contraseña">
            <button type="submit" class="auth-btn">Ingresar</button>
        </form>
        <div class="auth-link">¿Aún no tienes cuenta? <a href="/register">Regístrate aquí</a></div>
        <div class="auth-link"><a href="/" style="color:var(--blue-main);"><i class="fa-solid fa-house"></i> Volver al inicio</a></div>
    </div>
</body>
</html>
