<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | GuateAyuda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body style="display: flex;">
    <aside class="sidebar">
        <div class="logo"><span class="logo-guate">Guate</span><span class="logo-ayuda">Ayuda</span></div>
        <nav class="navigation">
            <a href="/dashboard" class="nav-item">Dashboard</a>
            <a href="/chat" class="nav-item">Chat IA</a>
            <a href="/reportes" class="nav-item">Reportes</a>
            <a href="/logout" class="nav-item">Salir</a>
        </nav>
    </aside>
    <main class="main-content" style="flex: 1; padding: 40px; background: #F7FBFC;">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
