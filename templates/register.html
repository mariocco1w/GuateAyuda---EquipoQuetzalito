<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Empresarial | GuateAyuda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='private.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-logo">
            <span style="font-size:30px; font-weight:700; color:var(--blue-deep);">Guate<span class="logo-ayuda">Ayuda</span></span>
        </div>
        <div class="auth-subtitle">Crea tu empresa y empieza a registrar operaciones</div>
        <form method="POST">
            <input type="text" name="nombre" class="auth-field" placeholder="Nombre de la empresa" required>
            <input type="text" name="propietario" class="auth-field" placeholder="Nombre del propietario" required>
            <input type="text" name="actividad_principal" class="auth-field" placeholder="Actividad principal (ej: Comedor)" required>
            <textarea name="descripcion" class="auth-field" placeholder="Breve descripción del negocio" rows="2"></textarea>
            <div style="display:flex; gap:10px;">
                <input type="text" name="departamento" class="auth-field" placeholder="Departamento" required>
                <input type="text" name="municipio" class="auth-field" placeholder="Municipio" required>
            </div>
            <button type="submit" class="auth-btn"><i class="fa-solid fa-rocket"></i> Finalizar Registro</button>
        </form>
        <div class="auth-link">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></div>
        <div class="auth-link"><a href="/" style="color:var(--blue-main);"><i class="fa-solid fa-house"></i> Volver al inicio</a></div>
    </div>
</body>
</html>
